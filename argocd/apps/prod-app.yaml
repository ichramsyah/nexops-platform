apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexops-app-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexops-platform
    tier: application
    environment: production
spec:
  project: default
  source:
    repoURL: https://github.com/ichramsyah/nexops-platform.git
    # Production tracks a release tag, not HEAD, for stability
    targetRevision: HEAD
    path: applications/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Production requires MANUAL sync (promotion after staging validation)
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
