apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexops-platform
    tier: devops
spec:
  project: default
  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: 10.5.1+2816
    helm:
      values: |
        # Use the external standalone PostgreSQL on nexops-db VM
        postgresql:
          enabled: false
        jdbcOverwrite:
          enable: true
          jdbcUrl: "jdbc:postgresql://nexops-db:5432/sonarqube"
          jdbcUsername: "sonarqube"
          jdbcPassword: "sonarqube_secret_pw"

        resources:
          requests:
            cpu: "400m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"

        persistence:
          enabled: true
          size: 10Gi

        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - name: sonarqube.nexops.local
              path: /
          tls:
            - secretName: sonarqube-tls
              hosts:
                - sonarqube.nexops.local

        # SonarQube requires max_map_count=262144 (set by Ansible common role)
        initSysctl:
          enabled: true
          vmMaxMapCount: 262144

        monitoringPasscode: "nexops-sonar-monitoring"
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
