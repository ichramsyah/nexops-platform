[defaults]
inventory          = ./inventory/hosts.ini
remote_user        = nexops
roles_path         = ./roles
private_key_file   = ~/.ssh/nexops_rsa
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
interpreter_python = /usr/bin/python3
forks              = 10
timeout            = 30

[ssh_connection]
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3
pipelining         = False
