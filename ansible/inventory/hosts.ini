# ============================================================
# NexOps Platform — Ansible Inventory
# ============================================================
# After `terraform apply`, run:
#   terraform output ansible_inventory_snippet
# and paste the result here, replacing the placeholder IPs below.
# ============================================================

[master]
nexops-master ansible_host=34.50.91.124 ansible_user=nexops ansible_ssh_private_key_file=~/.ssh/nexops_rsa

[worker]
nexops-worker ansible_host=34.101.235.249 ansible_user=nexops ansible_ssh_private_key_file=~/.ssh/nexops_rsa

[db]
nexops-db ansible_host=10.0.1.2 ansible_user=nexops ansible_ssh_private_key_file=~/.ssh/nexops_rsa ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q nexops@34.50.91.124 -i ~/.ssh/nexops_rsa -o StrictHostKeyChecking=no"'

# ============================================================
# Groups
# ============================================================
[k8s:children]
master
worker

[all_nodes:children]
master
worker
db
