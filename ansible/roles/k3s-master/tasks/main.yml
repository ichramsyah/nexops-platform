---
# roles/k3s-master/tasks/main.yml
# Purpose: Install K3s server (control plane), save token and kubeconfig

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download and install K3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server \
      --disable=traefik \
      --flannel-backend=vxlan \
      --node-name=nexops-master \
      --write-kubeconfig-mode=644 \
      --tls-san={{ ansible_host }}" sh -
  when: not k3s_binary.stat.exists
  become: true

- name: Wait for K3s to be fully ready
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present
    timeout: 120

- name: Wait for K3s API server to respond
  ansible.builtin.command: kubectl get --raw /readyz
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_api
  retries: 20
  delay: 10
  until: k3s_api.stdout == 'ok'
  become: true
  changed_when: false

- name: Fetch K3s node join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  become: true

- name: Save token as a fact for workers to use
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Fetch kubeconfig from master
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../kubeconfig.yaml"
    flat: true
  become: true

- name: Replace localhost with actual master IP in kubeconfig
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../kubeconfig.yaml"
    regexp: '127\.0\.0\.1'
    replace: "{{ ansible_host }}"
  delegate_to: localhost
  become: false

- name: Ensure kubectl is available via symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
  become: true

- name: Install Helm
  ansible.builtin.shell: |
    curl -sfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  become: true

- name: Verify K3s cluster nodes
  ansible.builtin.command: kubectl get nodes -o wide
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: nodes_output
  become: true

- name: Print cluster nodes
  ansible.builtin.debug:
    msg: "{{ nodes_output.stdout_lines }}"
