---
# roles/common/tasks/main.yml
# Applies to: all nodes (master, worker, db)
# Purpose:    OS hardening, package installation, kernel parameters for K8s

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  become: true

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - jq
      - acl
      - htop
      - vim
      - net-tools
      - nfs-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - socat
      - conntrack
      - ipset
    state: present
  become: true

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  become: true
  changed_when: false

- name: Remove swap from /etc/fstab permanently
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#].*\bswap\b'
    state: absent
    backup: true
  become: true

- name: Load required kernel modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'
  become: true

- name: Set kernel parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/k8s.conf
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward",                 value: "1" }
    - { key: "fs.inotify.max_user_watches",          value: "524288" }
    - { key: "fs.inotify.max_user_instances",        value: "512" }
    - { key: "vm.max_map_count",                     value: "262144" }  # Required for SonarQube/Elasticsearch
  become: true

- name: Set hostname to inventory hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true

- name: Configure /etc/hosts for cluster name resolution
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: |
      {{ hostvars['nexops-master']['ansible_host'] }} nexops-master
      {{ hostvars['nexops-worker']['ansible_host'] }} nexops-worker
      {{ hostvars['nexops-db']['ansible_host'] }} nexops-db
    marker: "# {mark} ANSIBLE NEXOPS MANAGED"
  become: true
