apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexops-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # To properly route /api to the backend without stripping the prefix 
    # (since our backend handlers explicitly handle /api) we don't need a rewrite target, 
    # or if we do, we need to map it correctly. The Go backend listens on /api/ so it's fine.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.nexops.local
      secretName: nexops-app-tls
  rules:
    - host: app.nexops.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexops-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexops-frontend
                port:
                  number: 80
