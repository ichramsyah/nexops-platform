apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexops-frontend
  labels:
    app: nexops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexops-frontend
  template:
    metadata:
      labels:
        app: nexops-frontend
    spec:
      containers:
        - name: nexops-frontend
          image: asia-southeast2-docker.pkg.dev/rinemaa-457218/nexops-app/frontend:14-b5bf5f4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexops-frontend
  labels:
    app: nexops-frontend
spec:
  selector:
    app: nexops-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
