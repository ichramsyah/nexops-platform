apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexops-backend
  labels:
    app: nexops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexops-backend
  template:
    metadata:
      labels:
        app: nexops-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: nexops-backend
          image: asia-southeast2-docker.pkg.dev/rinemaa-457218/nexops-app/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_HOST
              value: "nexops-db.default.svc.cluster.local"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: nexops-app-db-secret
                  key: db_name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nexops-app-db-secret
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexops-app-db-secret
                  key: db_password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexops-backend
  labels:
    app: nexops-backend
spec:
  selector:
    app: nexops-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
